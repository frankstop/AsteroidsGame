<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asteroids Arcade Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      height: 100%;
      width: 100%;
    }
    canvas {
      display: block;
      background: #000;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      font-size: 18px;
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RSVR6Y389R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-RSVR6Y389R');
  </script>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
  </div>
  <script>
    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Utility Functions
    function wrap(position, max) {
      if (position < 0) return position + max;
      if (position > max) return position - max;
      return position;
    }
    function distance(x1, y1, x2, y2) {
      return Math.hypot(x2 - x1, y2 - y1);
    }

    // Game Variables
    let score = 0;
    let lives = 3;
    let level = 0;
    let extraLifeScore = 10000;
    const keys = {};
    const bullets = [];
    const asteroids = [];
    const saucers = [];
    let saucerTimer = 0;
    const MAX_BULLETS = 4;

    // Game Objects
    class Ship {
      constructor() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.radius = 15;
        this.angle = 0; // In radians
        this.rotation = 0;
        this.velocity = { x: 0, y: 0 };
        this.thrusting = false;
        this.thrust = { x: 0, y: 0 };
      }
      update() {
        // Rotation
        this.angle += this.rotation;
        // Thrust
        if (this.thrusting) {
          this.thrust.x = Math.cos(this.angle) * 0.1;
          this.thrust.y = Math.sin(this.angle) * 0.1;
        } else {
          this.thrust.x = 0;
          this.thrust.y = 0;
        }
        this.velocity.x += this.thrust.x;
        this.velocity.y += this.thrust.y;
        // Apply friction
        this.velocity.x *= 0.99;
        this.velocity.y *= 0.99;
        // Update position
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        // Screen wrap
        this.x = wrap(this.x, canvas.width);
        this.y = wrap(this.y, canvas.height);
      }
      draw() {
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Draw ship as a triangle
        const noseX = this.x + Math.cos(this.angle) * this.radius;
        const noseY = this.y + Math.sin(this.angle) * this.radius;
        const leftX = this.x + Math.cos(this.angle + 2.5) * this.radius;
        const leftY = this.y + Math.sin(this.angle + 2.5) * this.radius;
        const rightX = this.x + Math.cos(this.angle - 2.5) * this.radius;
        const rightY = this.y + Math.sin(this.angle - 2.5) * this.radius;
        ctx.moveTo(noseX, noseY);
        ctx.lineTo(leftX, leftY);
        ctx.lineTo(rightX, rightY);
        ctx.closePath();
        ctx.stroke();
      }
      hyperspace() {
        // Warp to a random location
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        // Reset velocity to avoid immediate danger
        this.velocity = { x: 0, y: 0 };
      }
    }

    class Bullet {
      constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        const speed = 5;
        this.velocity = {
          x: Math.cos(angle) * speed + ship.velocity.x,
          y: Math.sin(angle) * speed + ship.velocity.y
        };
        this.radius = 2;
        this.life = 60; // Frames to live
      }
      update() {
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.x = wrap(this.x, canvas.width);
        this.y = wrap(this.y, canvas.height);
        this.life--;
      }
      draw() {
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Asteroid {
      constructor(x, y, size) {
        this.x = x;
        this.y = y;
        this.size = size; // "large", "medium", "small"
        this.radius = size === "large" ? 50 : size === "medium" ? 25 : 12;
        const angle = Math.random() * Math.PI * 2;
        const speed = size === "large" ? 1.5 : size === "medium" ? 2.5 : 3.5;
        this.velocity = {
          x: Math.cos(angle) * speed,
          y: Math.sin(angle) * speed
        };
        // Create irregular shape
        this.vertices = [];
        const numVertices = Math.floor(Math.random() * 5) + 5;
        for (let i = 0; i < numVertices; i++) {
          this.vertices.push(Math.random() * 0.4 + 0.8);
        }
      }
      update() {
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.x = wrap(this.x, canvas.width);
        this.y = wrap(this.y, canvas.height);
      }
      draw() {
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const numVertices = this.vertices.length;
        for (let i = 0; i < numVertices; i++) {
          const angle = i / numVertices * Math.PI * 2;
          const r = this.radius * this.vertices[i];
          const x = this.x + Math.cos(angle) * r;
          const y = this.y + Math.sin(angle) * r;
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.closePath();
        ctx.stroke();
      }
    }

    class Saucer {
      constructor(type) {
        this.type = type; // "large" or "small"
        this.radius = type === "large" ? 20 : 15;
        // Spawn on a random side
        if (Math.random() < 0.5) {
          this.x = Math.random() < 0.5 ? 0 : canvas.width;
          this.y = Math.random() * canvas.height;
        } else {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() < 0.5 ? 0 : canvas.height;
        }
        // Velocity: large saucer moves randomly; small saucer will track the ship
        if (this.type === "large") {
          const angle = Math.random() * Math.PI * 2;
          this.velocity = { x: Math.cos(angle) * 2, y: Math.sin(angle) * 2 };
        } else {
          // For small saucer, initial random velocity; it will adjust each frame
          this.velocity = { x: 0, y: 0 };
        }
        this.fireTimer = 0;
      }
      update() {
        if (this.type === "small") {
          // Track the ship
          const dx = ship.x - this.x;
          const dy = ship.y - this.y;
          const angle = Math.atan2(dy, dx);
          this.velocity.x = Math.cos(angle) * 3;
          this.velocity.y = Math.sin(angle) * 3;
        }
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.x = wrap(this.x, canvas.width);
        this.y = wrap(this.y, canvas.height);
        this.fireTimer++;
        if (this.fireTimer > 120) {
          this.fireTimer = 0;
          // Fire a bullet toward the ship (or random for large saucer)
          const angle = this.type === "small"
            ? Math.atan2(ship.y - this.y, ship.x - this.x)
            : Math.random() * Math.PI * 2;
          bullets.push(new Bullet(this.x, this.y, angle));
        }
      }
      draw() {
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Draw as a simple diamond shape
        ctx.moveTo(this.x, this.y - this.radius);
        ctx.lineTo(this.x + this.radius, this.y);
        ctx.lineTo(this.x, this.y + this.radius);
        ctx.lineTo(this.x - this.radius, this.y);
        ctx.closePath();
        ctx.stroke();
      }
    }

    // Initialize ship
    let ship = new Ship();

    // Start level with asteroids
    function newLevel() {
      level++;
      asteroids.length = 0;
      const numAsteroids = Math.floor(Math.random() * 3) + 4; // 4-6 large asteroids
      for (let i = 0; i < numAsteroids; i++) {
        // Spawn asteroids away from the ship
        let x, y;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
        } while (distance(x, y, ship.x, ship.y) < 100);
        asteroids.push(new Asteroid(x, y, "large"));
      }
    }

    // Split asteroid when hit
    function splitAsteroid(asteroid) {
      let newSize;
      let points;
      if (asteroid.size === "large") {
        newSize = "medium";
        points = 20;
      } else if (asteroid.size === "medium") {
        newSize = "small";
        points = 50;
      } else {
        points = 100;
      }
      score += points;
      updateScore();
      if (asteroid.size !== "small") {
        for (let i = 0; i < 2; i++) {
          const newAst = new Asteroid(asteroid.x, asteroid.y, newSize);
          // Slightly adjust velocity for the split pieces
          newAst.velocity.x += (Math.random() - 0.5) * 2;
          newAst.velocity.y += (Math.random() - 0.5) * 2;
          asteroids.push(newAst);
        }
      }
    }

    // Update UI
    function updateScore() {
      document.getElementById('score').textContent = score;
      document.getElementById('lives').textContent = lives;
      // Extra life every 10,000 points
      if (score >= extraLifeScore) {
        lives++;
        extraLifeScore += 10000;
      }
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Fire bullet
      if (e.code === 'Space' && bullets.length < MAX_BULLETS) {
        bullets.push(new Bullet(
          ship.x + Math.cos(ship.angle) * ship.radius,
          ship.y + Math.sin(ship.angle) * ship.radius,
          ship.angle
        ));
      }
      // Hyperspace
      if (e.code === 'KeyH') {
        ship.hyperspace();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Main Game Loop
    function gameLoop() {
      // Clear canvas
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Update ship controls
      ship.rotation = 0;
      ship.thrusting = false;
      if (keys['ArrowLeft']) {
        ship.rotation = -0.07;
      }
      if (keys['ArrowRight']) {
        ship.rotation = 0.07;
      }
      if (keys['ArrowUp']) {
        ship.thrusting = true;
      }

      // Update ship
      ship.update();
      ship.draw();

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.update();
        b.draw();
        if (b.life <= 0) {
          bullets.splice(i, 1);
        }
      }

      // Update asteroids
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.update();
        a.draw();
        // Collision with ship
        if (distance(ship.x, ship.y, a.x, a.y) < ship.radius + a.radius) {
          // Ship destroyed; lose a life and reset
          lives--;
          updateScore();
          ship = new Ship();
          if (lives <= 0) {
            alert("Game Over! Final Score: " + score);
            document.location.reload();
          }
        }
        // Collision with bullets
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (distance(b.x, b.y, a.x, a.y) < a.radius) {
            // Remove bullet and asteroid
            bullets.splice(j, 1);
            asteroids.splice(i, 1);
            splitAsteroid(a);
            break;
          }
        }
      }

      // Saucer spawning logic
      saucerTimer++;
      if (saucerTimer > 600) { // roughly every 10 seconds
        // Initially spawn large saucers
        saucers.push(new Saucer("large"));
        // After 10,000 points, also spawn small saucers periodically
        if (score >= 10000) {
          saucers.push(new Saucer("small"));
        }
        saucerTimer = 0;
      }

      // Update saucers
      for (let i = saucers.length - 1; i >= 0; i--) {
        const s = saucers[i];
        s.update();
        s.draw();
        // Check collision with ship
        if (distance(ship.x, ship.y, s.x, s.y) < ship.radius + s.radius) {
          lives--;
          updateScore();
          ship = new Ship();
          saucers.splice(i, 1);
          if (lives <= 0) {
            alert("Game Over! Final Score: " + score);
            document.location.reload();
          }
          continue;
        }
        // Check collision with bullets
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (distance(b.x, b.y, s.x, s.y) < s.radius) {
            // Award points based on saucer type
            score += s.type === "large" ? 200 : 1000;
            updateScore();
            bullets.splice(j, 1);
            saucers.splice(i, 1);
            break;
          }
        }
      }

      // If all asteroids are gone, start a new level
      if (asteroids.length === 0) {
        newLevel();
      }

      requestAnimationFrame(gameLoop);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Start the game
    newLevel();
    gameLoop();
  </script>
</body>
</html>
